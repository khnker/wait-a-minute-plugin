# OpenSpec Change: wait-a-minute-skill-registry-ondemand

## Change ID
wait-a-minute-skill-registry-ondemand

## Title
Skill Registry & On-Demand Skill Loading — adquisición, indexación y selección de skills desde repos externos sin contaminar contexto

## Estado
🔄 En implementación — reemplaza y amplía openspec-change-skill-registry.yaml

## Principio Recto
«WAM debe poseer el índice y decidir qué skill necesita la tarea; OpenCode debe seguir siendo responsable de cargar y ejecutar la skill.»

Los repos externos son **fuentes de adquisición**, no la fuente de verdad del runtime. WAM clona, indexa y normaliza; OpenCode carga bajo demanda únicamente las skills que WAM selecciona. Las políticas perpetuas (Scope/Verify/Simplify) quedan **fuera** de este mecanismo.

## Problemática que Resuelve

El corpus de skills puede crecer a cientos o miles (antigravity-awesome-skills, etc.). Cargar todo al contexto destruye la ventana del agente. Se necesita:

1. Adquisición de skills desde repos externos (clone local)
2. Indexación metadata-first (nunca cargar SKILL.md completo salvo selección)
3. Routing con scoring ponderado configurables
4. Carga on-demand vía runtime nativo de OpenCode
5. Políticas perpetuas separadas e independientes del registry

