## 3. Clasificación de Rigor (3 Niveles)

### MINIMAL
- **Para**: cambios de texto, triviales, localizados, evidentes
- **Proceso**: Scope → Execute → Verify
- **Ejemplos**: Renombrar variable, arreglar typo, formateo menor

### STANDARD
- **Para**: cambios normales de código, funciones nuevas, fixes simples
- **Proceso**: Investigate → Scope → Execute → Review → Verify
- **Cuándo aplicar**: Cuando hayamiliaridad con el código pero aún se necesita contexto

### RIGOROUS
- **Para**: cambios arquitectónicos, seguridad, migraciones, alto blast radius, requisitos ambiguos, alto riesgo de regresión
- **Proceso**: Investigate → Scope → Plan → Execute → Review → Verify
- **Debug**: activarse cuando exista evidencia de fallo, independientemente del tier
- **Cuándo aplicar**: Cambios con impacto amplio, riesgo alto, requisitos poco claros

## 4. Readiness Gate (Checkpoint Pre-Execution)

**Antes** de iniciar implementación STANDARD o RIGOROUS, comprobar como mínimo:

- [ ] scope known (alcance conocido)
- [ ] affected surface reasonably known (superficie afectada razonablemente conocida)
- [ ] verification strategy known (estrategia de verificación conocida)
- [ ] critical ambiguity resolved (ambigüedades críticas resueltas)

**Si un elemento crítico no está resuelto**: WAIT — el sistema no debe permitir que el agente compensa incertidumbre crítica simplemente empezando a editar código.

## 5. Skill Registry (Simplificado)

**Objetivo**: Soportar skills externos sin convertirse en repositorio monolítico.

**Fuentes** (referenciadas, no incrustadas):
- whobat/AI-Agent-skills (primary)
- khasky/awesome-agent-skills (secondary)
- sickn33/antigravity-awesome-skills (discovery pool)

**Registro por skill (mínimo)**:
```
skill:
  id: <identificador>
  source:
    repository: <owner/repo>
    path: <path/within/repo>
    ref: <commit/tag>  ← pinned version, NOT "main" by default
  category: <tipo>
  capabilities: <lista>
  compatibility:
    opencode: true
  risk: low|medium|high
  status: discovered|evaluating|approved|active|deprecated|rejected
```

**Estados**:
- discovered: detectado, **no automático**
- evaluating: en evaluación
- approved: aprobado → puede seleccionarse
- active: en uso
- deprecated: obsoleto
- rejected: rechazado (nunca automático)

**Quality Gate previo a approval**: estructura SKILL.md, compatibilidad OpenCode, riesgos detectados.

## 5. Skill Selection

**¿Qué capacidad adicional necesita esta tarea?**

```
authentication change
    ↓
security capability
    ↓
Skill Registry
    ↓
security-review
```

**Considerar**:
- Intención de la tarea
- Categoría
- Riesgo
- Archivos afectados
- Herramientas disponibles
- Compatibilidad
- Políticas activas
- Complejidad

**No necesario**: semantic search, embeddings, SQLite, graph databases, MCP para v1.

**Implementación simple y determinista** preferible.

## 5. OpenCode Integration

**Usar runtime nativo de Skills de OpenCode** — no crear segundo runtime.

```
Wait a Minute
    ↓
select capability
    ↓
OpenCode skill runtime
    ↓
load SKILL.md
```

Wait a Minute **controla cuándo y por qué** usar una capacidad.
OpenCode **controla cómo** cargarla y ejecutarla.

## 6. Precedencia

Cuando haya conflictos:
```
Wait a Minute safety/completion gates
    >
OpenSpec requirements
    >
external skill instructions
```

**Un skill externo no puede**:
- saltarse Verify
- ampliar silenciosamente Scope
- ignorar requisitos
- desactivar gates
- introducir acciones destructivas sin autorización

## 7. Qué NO se Implementa (Fuera de Alcance)

**Este Change explícitamente NO**:

- Arquitectura multi-agent compleja
- Agentes especializados permanentes
- Consenso entre múltiples modelos
- Memoria persistente compleja
- MCP obligatorio
- Graph database
- SQLite para Skill Registry v1
- Marketplace
- Sincronización automática de hundreds de skills
- Instalación automática de skills
- Reemplazo del runtime de Skills de OpenCode

## 7. Criterios de Aceptación

La implementación debe demostrar que:

| Criterio | Descripción |
|----------|-------------|
| Assessment | Tarea clasificable como MINIMAL/STANDARD/RIGOROUS; clasificación considera riesgo/ambigüedad/blast radius; proceso cambia según nivel |
| Scope | Agente identifica scope antes de cambios relevantes; cambios no relacionados no incorporados silenciosamente; cambios materiales generan reevaluación |
| Investigation | Tareas simples pueden saltirse investigación; tareas complejas pueden requerirla; profundidad proporcional al contexto |
| Review | Review puede activarse condicionalmente; Review y Verify tienen responsabilidades distintas |
| Verify | DONE requiere evidencia; Verify fallido impide completar; evidencia proporcional al riesgo |
| Debug | Fallos generan ciclo diagnóstico; "test verde" no es explicación de causa raíz |
| Skills | Skill externo puede registrarse, evaluarse, aprobarsele, seleccionarse; OpenCode puede cargarlo vía nativo; skills no aprobados no se activan automáticamente |
| Plan Delta | Cambio material de scope detectado; genera reevaluación; puede exigir nueva verificación |

