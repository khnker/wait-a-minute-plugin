# OpenSpec Change: wait-a-minute-policy-engine-consolidated

## Change ID
wait-a-minute-policy-engine-consolidated

## Title
Policy Engine ligero de Wait a Minute — decisiones proporcionales al riesgo, sin orchestrator pesado

## Estado
✅ Aprobado — reemplaza y ajusta cambios anteriores (cognitive-policies, skill-registry, policy-engine)

## Principio Recto
«El rigor debe ser proporcional al riesgo de la tarea.»

Wait a Minute no debe convertirse en un framework multi-agent ni reemplazar el runtime de Skills de OpenCode. Su propósito es decidir **cuánto rigor** necesita una tarea antes, durante y después de su ejecución, y delegar la ejecución real a OpenCode.

## Problemática que Resuelve

Los cambios previos definían 6 políticas nativas, un Skill Registry externo con Quality Gate, tiers MINIMAL/STANDARD/RIGOROUS con procesos detallados, Plan Delta, Readiness Gate, etc.

**Riesgo**: Se convertían en un framework multi-agent pesado que limitaba la libertad técnica y añadía ceremonia innecesaria para tareas triviales.

## Solución: Policy Engine Ligero

Wait a Minute evoluciona hacia un engine que:
1. **Decide cuánto rigor** necesita una tarea antes, durante y después de su ejecución
2. **Aplica gates correspondientes** (selectivamente, no todos para todo)
3. **Delegará ejecución real** a OpenCode
4. **Evita dos extremos**:
   - Agentes que actúan demasiado pronto sin comprender el contexto
   - Workflows excesivamente ceremoniosos para tareas triviales

## 1. Responsabilidades

### Wait a Minute
- Analizar la tarea
- Estimar nivel de rigor requerido
- Determinar qué políticas deben activarse
- Detectar ambigüedad y scope
- Seleccionar skills externos cuando sean necesarios
- Controlar cambios de alcance durante la ejecución
- Exigir revisión cuando el riesgo lo justifique
- Exigir evidencia antes de permitir "DONE"

### OpenCode (responsable de)
- Ejecución
- Edición de archivos
- Ejecución de comandos
- Utilización del runtime de skills
- Interacción con herramientas

### OpenSpec (responsable de)
- Definición del cambio
- Requisitos
- Escenarios
- Criterios de aceptación
- Contrato del trabajo

