## 8. Principio de Diseño

«Wait a Minute debe añadir control, no ceremonia.»

- Una tarea sencilla debe permanecer sencilla
- Una tarea peligrosa debe volverse deliberada
- Una tarea ambigua debe detenerse antes de producir cambios incorrectos
- Ninguna tarea debe declararse terminada sin evidencia suficiente

